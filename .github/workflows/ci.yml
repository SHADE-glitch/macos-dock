name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history is required: `check:log` resolves the frozen-upstream
      # anchor (a2140d0) and walks `anchor..HEAD`, which a shallow clone lacks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check:log
      # Coverage reading (not a gate): Node's built-in coverage over the pure
      # suites. It prints a table; with no threshold it cannot fail the run.
      - run: npm run test:coverage
