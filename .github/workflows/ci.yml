name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history is required: `check:log` resolves the frozen-upstream
      # anchor (a2140d0) and walks `anchor..HEAD`, which a shallow clone lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm test
      - run: npm run check:log
      # Coverage reading (not a gate): Node's built-in coverage over the pure
      # suites. It prints a table; with no threshold it cannot fail the run.
      - run: npm run test:coverage
